<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Online Player Database - Professional Search</title>
    <style>
        :root {
            --primary-color: #00e676; /* Màu xanh lá đặc trưng bóng đá */
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border: #2d2d2d;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Khung tìm kiếm chuyên nghiệp */
        .search-wrapper {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            background: #252525;
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 230, 118, 0.2);
        }

        #stats {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Bảng dữ liệu */
        .table-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #252525;
            padding: 16px;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Định dạng nội dung ô */
        .spid-code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: var(--primary-color);
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .season-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .season-icon {
            width: 32px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .player-name {
            font-weight: 600;
            color: #efefef;
        }

        #loading-overlay {
            padding: 40px;
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Hiệu ứng mượt cho mobile */
        @media (max-width: 600px) {
            .search-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="search-wrapper">
        <div class="search-grid">
            <input type="text" id="nameInput" placeholder="🔍 Tên cầu thủ" oninput="filterData()">

    // Tạo Map để tối ưu tốc độ tìm mùa giải từ ID cầu thủ
    const seasonMap = new Map(seasons.map(s => [s.seasonId, s]));
    let playerDB = [];

    // HÀM CHUẨN HÓA: Bỏ dấu tiếng Việt, bỏ ký tự đặc biệt như ' `
    function cleanString(str) {
        if (!str) return "";
        return str.normalize("NFD")
                  .replace(/[\u0300-\u036f]/g, "") // Bỏ dấu
                  .replace(/đ/g, "d").replace(/Đ/g, "D")
                  .replace(/[^a-zA-Z0-9 ]/g, "") // Bỏ ký tự đặc biệt như dấu nháy '
                  .toLowerCase()
                  .trim();
    }

    // Tải dữ liệu từ file JSON
    async function loadData() {
        try {
            const response = await fetch('./spid_translated.json');
            if (!response.ok) throw new Error("File spid_translated.json không tồn tại!");
            playerDB = await response.json();
            
            // Render gợi ý mùa giải vào Datalist
            const datalist = document.getElementById('seasonList');
            seasons.forEach(s => {
                const option = document.createElement('option');
                option.value = s.className;
                datalist.appendChild(option);
            });

            document.getElementById('loading-overlay').style.display = 'none';
            updateStats(`Sẵn sàng: ${playerDB.length.toLocaleString()} cầu thủ.`);
        } catch (error) {
            document.getElementById('loading-overlay').innerHTML = `❌ Lỗi: ${error.message}`;
            console.error(error);
        }
    }

    // Xử lý lọc dữ liệu
    function filterData() {
        const nameQueryRaw = document.getElementById('nameInput').value;
        const nameQuery = cleanString(nameQueryRaw); // Chuẩn hóa từ khóa tên
        
        const seasonQueryRaw = document.getElementById('seasonInput').value;
        const seasonQuery = seasonQueryRaw.trim().toLowerCase(); // Chuẩn hóa từ khóa mùa

        const tbody = document.getElementById('playerList');
        
        // Chỉ tìm khi có ít nhất 2 ký tự tên hoặc đã chọn mùa
        if (nameQuery.length < 2 && seasonQuery === "") {
            tbody.innerHTML = "";
            updateStats("Vui lòng nhập thêm thông tin để tìm kiếm...");
            return;
        }

        const filtered = playerDB.filter(p => {
            // Lấy ID mùa giải từ SPID
            const pSeasonId = Math.floor(p.id / 1000000);
            const seasonObj = seasonMap.get(pSeasonId);
            const seasonName = seasonObj ? seasonObj.className.toLowerCase() : "";

            // 1. So khớp tên (Đã chuẩn hóa không dấu)
            const playerNameClean = cleanString(p.name);
            const isNameMatch = nameQuery === "" || playerNameClean.includes(nameQuery);
            
            // 2. So khớp mùa giải (SỬA LỖI ICON vs ICONTM)
            let isSeasonMatch = true;
            if (seasonQuery !== "") {
                // Ưu tiên khớp tuyệt đối nếu gõ chính xác
                const exactMatch = (seasonName === seasonQuery);
                // Khớp một phần nếu từ khóa đủ dài (tránh gõ "i" ra hàng loạt)
                const partialMatch = seasonName.includes(seasonQuery) && seasonQuery.length >= 2;
                
                isSeasonMatch = exactMatch || partialMatch;
            }

            return isNameMatch && isSeasonMatch;
        });

        // Hiển thị kết quả (Sắp xếp SPID mới nhất lên đầu, giới hạn 200 dòng để mượt trang)
        renderResults(filtered.sort((a, b) => b.id - a.id).slice(0, 200));
        updateStats(`Tìm thấy ${filtered.length.toLocaleString()} cầu thủ.`);
    }

    // Render bảng kết quả
    function renderResults(data) {
        const tbody = document.getElementById('playerList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color: #888;">Không tìm thấy kết quả phù hợp</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(p => {
            const pSeasonId = Math.floor(p.id / 1000000);
            const season = seasonMap.get(pSeasonId);
            
            return `
                <tr>
                    <td><span class="spid-code">${p.id}</span></td>
                    <td><span class="player-name">${p.name}</span></td>
                    <td>
                        <div class="season-box">
                            ${season 
                                ? `<img src="${season.seasonImg}" class="season-icon" alt="${season.className}"> <span>${season.className}</span>` 
                                : `<span style="color:#666">Mùa ${pSeasonId}</span>`}
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function updateStats(text) {
        document.getElementById('stats').textContent = text;
    }

    window.onload = loadData;
</script>
