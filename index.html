<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Online Player Database — Pro Edition</title>
    <meta name="description" content="Tra cứu SPID cầu thủ FC Online nhanh nhất. Tìm theo tên, SPID, mùa giải.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS RESET & VARIABLES ===== */
        :root {
            --primary: #00e676;
            --primary-dark: #00c853;
            --primary-glow: rgba(0, 230, 118, 0.12);
            --primary-glow-md: rgba(0, 230, 118, 0.20);
            --primary-glow-lg: rgba(0, 230, 118, 0.30);
            --accent: #7c4dff;
            --bg-0: #050508;
            --bg-1: #0a0a10;
            --bg-2: #12121a;
            --bg-3: #181824;
            --bg-4: #222232;
            --glass: rgba(18, 18, 26, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-0: #ffffff;
            --text-1: #e2e2ec;
            --text-2: #a0a0b8;
            --text-3: #666680;
            --text-4: #44445a;
            --border: #262636;
            --border-light: #36364a;
            --success: #66bb6a;
            --warning: #ffb74d;
            --danger: #ef5350;
            --info: #42a5f5;
            --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
            --s-sm: 0 2px 8px rgba(0,0,0,0.3);
            --s-md: 0 6px 24px rgba(0,0,0,0.4);
            --s-lg: 0 12px 48px rgba(0,0,0,0.6);
            --t-fast: 0.15s ease;
            --t-norm: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-0); color: var(--text-1); min-height: 100vh; overflow-x: hidden; line-height: 1.6; }
        ::selection { background: var(--primary-glow-lg); color: var(--primary); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-1); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

        /* ===== BACKGROUND ===== */
        .bg-ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-ambient::before { content: ''; position: absolute; top: -30%; left: 50%; transform: translateX(-50%); width: 140%; height: 60%; background: radial-gradient(ellipse, rgba(0,230,118,0.05) 0%, transparent 60%); }
        .bg-ambient::after { content: ''; position: absolute; bottom: -20%; right: -10%; width: 60%; height: 50%; background: radial-gradient(ellipse, rgba(124,77,255,0.04) 0%, transparent 60%); }
        .bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, black 30%, transparent 100%); -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, black 30%, transparent 100%); }

        /* ===== HEADER ===== */
        .header { position: sticky; top: 0; z-index: 200; background: var(--glass); backdrop-filter: blur(24px); border-bottom: 1px solid var(--glass-border); }
        .header-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
        .logo-glyph { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #00bfa5); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 16px rgba(0,230,118,0.25); transition: transform var(--t-norm); }
        .logo:hover .logo-glyph { transform: rotate(-10deg) scale(1.05); }
        .logo-title { font-size: 1.15rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, var(--text-2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 0.65rem; color: var(--text-3); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; display: block; }
        
        .visitor-badge { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 30px; font-size: 0.75rem; color: var(--text-2); }
        .visitor-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .visitor-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text-0); }

        /* ===== MAIN & HERO ===== */
        .main { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 24px; }
        .hero { text-align: center; padding: 40px 0 20px; }
        .hero h1 { font-size: 2.6rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 12px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-3); max-width: 500px; margin: 0 auto; font-size: 1.05rem; }

        /* ===== STATS ===== */
        .stats-ribbon { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-tile { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; display: flex; align-items: center; gap: 16px; transition: var(--t-norm); }
        .stat-tile:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--s-md); }
        .stat-glyph { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: var(--bg-3); color: var(--primary); }
        .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 800; color: var(--text-0); line-height: 1.1; }
        .stat-lbl { font-size: 0.7rem; color: var(--text-3); text-transform: uppercase; font-weight: 600; margin-top: 4px; }

        /* ===== SEARCH PANEL ===== */
        .search-panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px; margin-bottom: 24px; box-shadow: var(--s-md); position: relative; }
        .sp-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .mode-switch { display: flex; background: var(--bg-1); padding: 4px; border-radius: var(--r-sm); border: 1px solid var(--border); }
        .mode-btn { padding: 8px 20px; border: none; background: transparent; color: var(--text-3); font-weight: 600; border-radius: 6px; cursor: pointer; transition: var(--t-fast); }
        .mode-btn.active { background: var(--primary); color: #000; box-shadow: 0 2px 10px rgba(0,230,118,0.3); }
        
        .search-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .field { position: relative; }
        .field-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-4); z-index: 2; transition: var(--t-norm); }
        .field input { width: 100%; background: var(--bg-1); border: 1px solid var(--border); color: var(--text-0); padding: 14px 40px 14px 44px; border-radius: var(--r-md); font-size: 15px; outline: none; transition: var(--t-norm); font-family: 'Inter', sans-serif; }
        .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); background: var(--bg-0); }
        .field input:focus ~ .field-icon { color: var(--primary); }
        .field-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; border: none; background: var(--bg-3); color: var(--text-2); cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; }
        .field input:not(:placeholder-shown) ~ .field-clear { display: flex; }
        .field-clear:hover { background: var(--danger); color: #fff; }

        /* CUSTOM SEASON DROPDOWN */
        .season-dropdown { position: relative; }
        .season-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--primary); border-radius: var(--r-md); margin-top: 8px; max-height: 280px; overflow-y: auto; z-index: 999; box-shadow: var(--s-lg); display: none; opacity: 0; transform: translateY(-10px); transition: all 0.2s ease; }
        .season-list.show { display: block; opacity: 1; transform: translateY(0); }
        .season-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background var(--t-fast); }
        .season-item:last-child { border-bottom: none; }
        .season-item:hover { background: var(--primary-glow); color: var(--text-0); }
        .season-item img { width: 32px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .season-item span { font-weight: 600; font-size: 14px; }

        /* ===== TABLE ===== */
        .table-panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--s-md); }
        .tb-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg-1); padding: 16px 24px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); font-weight: 700; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
        th:hover { color: var(--primary); }
        td { padding: 14px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background: var(--bg-3); }
        
        /* OVR BADGE */
        .ovr-badge { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 8px; font-weight: 800; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #fff; box-shadow: var(--s-sm); text-shadow: 0 1px 2px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); }
        .ovr-120 { background: linear-gradient(135deg, #ffb300, #f57c00); box-shadow: 0 0 10px rgba(255,152,0,0.3); } /* Gold */
        .ovr-110 { background: linear-gradient(135deg, #e040fb, #aa00ff); box-shadow: 0 0 10px rgba(170,0,255,0.3); } /* Purple */
        .ovr-100 { background: linear-gradient(135deg, #f06292, #d81b60); } /* Pink/Red */
        .ovr-90  { background: linear-gradient(135deg, #4dd0e1, #0097a7); } /* Blue */
        .ovr-low { background: linear-gradient(135deg, #78909c, #455a64); } /* Gray */

        .spid-code { font-family: 'JetBrains Mono', monospace; color: var(--primary); background: var(--primary-glow); padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: var(--t-fast); border: 1px solid transparent; }
        .spid-code:hover { background: var(--primary-glow-md); border-color: var(--primary); transform: translateY(-1px); }
        .spid-code:active { transform: scale(0.95); }
        
        .player-row { display: flex; align-items: center; gap: 16px; }
        .avatar-wrap { width: 52px; height: 52px; position: relative; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 8px; object-fit: contain; object-position: top; background: transparent; transition: transform var(--t-norm); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
        tr:hover .avatar-img { transform: scale(1.15); }
        .player-name { font-weight: 700; color: var(--text-0); font-size: 15px; }
        .player-pid { font-size: 11px; color: var(--text-4); font-family: 'JetBrains Mono', monospace; margin-top: 2px;}
        
        .season-cell { display: flex; align-items: center; gap: 12px; }
        .season-img { width: 34px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
        .season-label { font-weight: 600; font-size: 14px; color: var(--text-1); }

        /* ===== PAGINATION & EXTRAS ===== */
        .pager { display: flex; justify-content: center; padding: 20px; gap: 8px; flex-wrap: wrap; }
        .pg-btn { min-width: 40px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text-2); font-weight: 600; cursor: pointer; transition: var(--t-fast); }
        .pg-btn:hover:not(:disabled) { background: var(--primary); color: #000; border-color: var(--primary); }
        .pg-btn.cur { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 2px 8px rgba(0,230,118,0.3); }
        .pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .hl { color: var(--primary); background: var(--primary-glow); padding: 0 4px; border-radius: 4px; font-weight: bold; }
        .empty { padding: 80px 20px; text-align: center; }
        .empty-ico { font-size: 48px; margin-bottom: 16px; opacity: 0.5; filter: grayscale(1); }
        .empty-title { font-size: 18px; font-weight: 700; color: var(--text-1); }
        .empty-desc { color: var(--text-3); font-size: 14px; margin-top: 8px; }

        /* Toast Notification */
        .toast-area { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column-reverse; gap: 10px; pointer-events: none; }
        .toast { padding: 12px 20px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--primary); border-left: 4px solid var(--primary); border-radius: var(--r-sm); color: #fff; font-weight: 500; font-size: 14px; box-shadow: var(--s-md); animation: slideIn 0.3s ease forwards; pointer-events: auto; }
        .toast.fade-out { animation: fadeOut 0.3s ease forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* Responsive */
        @media (max-width: 768px) {
            .search-row { grid-template-columns: 1fr; gap: 12px; }
            .hero h1 { font-size: 1.8rem; }
            .stats-ribbon { grid-template-columns: repeat(2, 1fr); }
            th, td { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div class="bg-ambient"></div><div class="bg-grid"></div>

<header class="header">
    <div class="header-inner">
        <a class="logo" onclick="location.reload()">
            <div class="logo-glyph">⚽</div>
            <div>
                <span class="logo-title">FC Online Database</span>
                <span class="logo-sub">Pro Search Engine</span>
            </div>
        </a>
        <div class="header-right">
            <div class="visitor-badge" title="Đã reset lúc 0h sáng (Giờ VN)">
                <div class="visitor-dot"></div>
                <span>Hôm nay:</span>
                <span class="visitor-count" id="visitorCount">...</span>
                <span>khách</span>
            </div>
        </div>
    </div>
</header>

<main class="main">
    <section class="hero">
        <h1>Tra cứu cầu thủ FC Online</h1>
        <p>Tìm kiếm thông minh ưu tiên chỉ số (OVR). Dữ liệu cập nhật liên tục.</p>
    </section>

    <div class="stats-ribbon">
        <div class="stat-tile"><div class="stat-glyph">👤</div><div><div class="stat-num" id="sTotalPlayers">—</div><div class="stat-lbl">Cầu thủ</div></div></div>
        <div class="stat-tile"><div class="stat-glyph" style="color:var(--warning)">🏆</div><div><div class="stat-num" id="sTotalSeasons">—</div><div class="stat-lbl">Mùa giải</div></div></div>
        <div class="stat-tile"><div class="stat-glyph" style="color:var(--info)">🔍</div><div><div class="stat-num" id="sSearches">0</div><div class="stat-lbl">Lượt tìm</div></div></div>
    </div>

    <div class="search-panel">
        <div class="sp-header">
            <h3 style="font-size:16px; display:flex; align-items:center; gap:8px;">
                <span style="width:8px;height:8px;background:var(--primary);border-radius:50%;box-shadow:0 0 10px var(--primary);"></span> Tìm kiếm Nâng cao
            </h3>
            <div class="mode-switch">
                <button class="mode-btn active" id="mNameBtn" onclick="setMode('name')">Theo Tên</button>
                <button class="mode-btn" id="mSpidBtn" onclick="setMode('spid')">Theo SPID</button>
            </div>
        </div>

        <div class="search-row" id="searchRow">
            <div class="field" id="fName">
                <span class="field-icon">👤</span>
                <input type="text" id="inName" placeholder="Tên cầu thủ (VD: ronaldo, gullit...)" oninput="debouncedFilter()" autocomplete="off">
                <button class="field-clear" onclick="clrIn('inName')">✕</button>
            </div>
            <div class="field" id="fSpid" style="display:none;">
                <span class="field-icon">🔢</span>
                <input type="text" id="inSpid" placeholder="Nhập SPID (VD: 300209658)" oninput="debouncedFilter()" autocomplete="off">
                <button class="field-clear" onclick="clrIn('inSpid')">✕</button>
            </div>
            
            <!-- CUSTOM SEASON DROPDOWN -->
            <div class="field season-dropdown" id="fSeason">
                <span class="field-icon">🏆</span>
                <input type="text" id="inSeason" placeholder="Chọn hoặc gõ mùa thẻ..." autocomplete="off" onfocus="showSeasonList()" oninput="filterSeasonList()">
                <button class="field-clear" onclick="clrIn('inSeason')">✕</button>
                <div class="season-list" id="seasonList"></div>
            </div>
            
            <div class="field" id="fPid">
                <span class="field-icon">#️⃣</span>
                <input type="text" id="inPid" placeholder="PID gốc (VD: 209658)" oninput="debouncedFilter()" autocomplete="off">
                <button class="field-clear" onclick="clrIn('inPid')">✕</button>
            </div>
        </div>
    </div>

    <div class="table-panel">
        <div class="tb-scroll">
            <table>
                <thead id="tHead" style="display:none;">
                    <tr>
                        <th style="width:90px; text-align:center;" onclick="changeSort('ovr')" title="Sắp xếp theo Chỉ số">OVR <span id="siOvr" style="color:var(--primary)">▲</span></th>
                        <th style="width:180px;" onclick="changeSort('spid')" title="Sắp xếp theo SPID">SPID <span id="siSpid"></span></th>
                        <th onclick="changeSort('name')" title="Sắp xếp theo Tên">Cầu thủ <span id="siName"></span></th>
                        <th style="width:250px;" onclick="changeSort('season')" title="Sắp xếp theo Mùa">Mùa giải <span id="siSeason"></span></th>
                    </tr>
                </thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>
        <div class="pager" id="pager" style="display:none;"></div>
    </div>
</main>

<div class="toast-area" id="toastArea"></div>

// =====================================================
function showToast(msg) {
    const container = document.getElementById('toastArea');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = msg;
    container.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

function copyToClipboard(text, label) {
    navigator.clipboard.writeText(text).then(() => {
        showToast(`✅ Đã sao chép ${label}: <b>${text}</b>`);
    }).catch(err => {
        console.error('Copy failed', err);
    });
}

// =====================================================
// VISITOR COUNTER (GMT+7 FIX)
// =====================================================
async function loadVisitorCount() {
    const el = document.getElementById('visitorCount');
    
    // Lấy ngày hiện tại theo chuẩn GMT+7
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const gmt7Date = new Date(utc + (3600000 * 7));
    const dateStr = gmt7Date.getFullYear() + '-' + String(gmt7Date.getMonth()+1).padStart(2,'0') + '-' + String(gmt7Date.getDate()).padStart(2,'0');
    
    const countKey = 'fco-visitors-' + dateStr.replace(/-/g, '');
    const localHasCounted = 'counted_' + dateStr;

    // Xoá log cũ của ngày hôm trước cho nhẹ localStorage
    Object.keys(localStorage).forEach(key => {
        if(key.startsWith('counted_') && key !== localHasCounted) localStorage.removeItem(key);
    });

    try {
        let url = `https://api.counterapi.dev/v1/fconlinedb_pro_v2/${countKey}`;
        // Nếu trình duyệt chưa đếm trong ngày hôm nay -> Gửi yêu cầu Tăng (+1)
        if (!localStorage.getItem(localHasCounted)) {
            url += '/up';
            localStorage.setItem(localHasCounted, 'true');
        }
        
        const res = await fetch(url);
        const data = await res.json();
        el.textContent = data.count ? data.count.toLocaleString() : '1';
    } catch(e) {
        el.textContent = "1"; // Fallback nếu API lỗi
    }
}

    items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
    });
}
// Click ra ngoài để ẩn dropdown
document.addEventListener('click', (e) => {
    if (!e.target.closest('.season-dropdown')) hideSeasonList();
});

// =====================================================
// TÌM KIẾM & SẮP XẾP
// =====================================================
let dbTimer;
function debouncedFilter() { clearTimeout(dbTimer); dbTimer = setTimeout(filterData, 150); }

function setMode(m) { 
    searchMode = m; 
    document.getElementById('mNameBtn').classList.toggle('active', m==='name');
    document.getElementById('mSpidBtn').classList.toggle('active', m==='spid');
    document.getElementById('fName').style.display = m==='name' ? '' : 'none';
    document.getElementById('fPid').style.display = m==='name' ? '' : 'none';
    document.getElementById('fSpid').style.display = m==='spid' ? '' : 'none';
    debouncedFilter();
}
function clrIn(id) { document.getElementById(id).value = ''; debouncedFilter(); }

function filterData() {
    const sq = document.getElementById('inSeason').value.trim().toLowerCase();
    let nq = '', nk = [], spidq = '', pidq = '';
    
    if (searchMode === 'name') {
        nq = norm(document.getElementById('inName').value);
        nk = nq.split(/\s+/).filter(t => t.length > 0);
        pidq = document.getElementById('inPid').value.trim();
    } else {
        spidq = document.getElementById('inSpid').value.trim();
    }

    if (!nq && !sq && !spidq && !pidq) { showEmpty('init'); return; }

    const filtered = playerIndex.filter(e => {
        if (searchMode === 'spid' && spidq) {
            const m = e.spidStr.includes(spidq) || e.pidStr.includes(spidq);
            return sq ? m && e.seasonNorm.includes(sq) : m;
        }
        let nm = true; if (nk.length > 0) nm = nk.every(t => e.nameNorm.includes(t));
        let pm = true; if (pidq) pm = e.pidStr.includes(pidq);
        let sm = true; if (sq) sm = e.seasonNorm.includes(sq);
        return nm && pm && sm;
    });

    // CHẤM ĐIỂM ƯU TIÊN SẮP XẾP
    const scored = filtered.map(e => {
        let sc = 0;
        if (nk.length > 0 && e.nameNorm.startsWith(nk[0])) sc += 100;
        return { entry: e, score: sc, ovr: e.ref.ovr || 0 };
    });

    // Sort: Score -> OVR (Cao xuống thấp) -> ID
    scored.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score; 
        if (b.ovr !== a.ovr) return b.ovr - a.ovr;         
        return b.entry.ref.id - a.entry.ref.id;
    });

    currentFiltered = scored.map(s => s.entry);
    currentPage = 1; currentSortBy = 'ovr'; currentSortDir = 'desc';
    updSortUI();
    
    if (!currentFiltered.length) showEmpty('no');
    else renderPage();
    
    document.getElementById('sSearches').textContent = (++searchCnt).toLocaleString();
}

function changeSort(f) {
    if (currentSortBy === f) {
        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
    } else { 
        currentSortBy = f; 
        currentSortDir = (f === 'name') ? 'asc' : 'desc'; 
    }
    
    currentFiltered.sort((a, b) => {
        let valA, valB;
        if (f === 'ovr') { valA = a.ref.ovr || 0; valB = b.ref.ovr || 0; }
        else if (f === 'spid') { valA = a.ref.id; valB = b.ref.id; }
        else if (f === 'name') { valA = a.nameNorm; valB = b.nameNorm; }
        else if (f === 'season') { valA = a.seasonNorm; valB = b.seasonNorm; }
        
        if (valA < valB) return currentSortDir === 'asc' ? -1 : 1;
        if (valA > valB) return currentSortDir === 'asc' ? 1 : -1;
        return 0;
    });
    
    updSortUI(); currentPage = 1; renderPage();
}

function updSortUI() {
    ['ovr','spid','name','season'].forEach(f => {
        const el = document.getElementById('si' + f.charAt(0).toUpperCase() + f.slice(1));
        if (el) {
            el.textContent = currentSortBy === f ? (currentSortDir === 'asc' ? '▲' : '▼') : '';
            el.style.color = currentSortBy === f ? 'var(--primary)' : 'inherit';
        }
    });
}

function showEmpty(type) {
    document.getElementById('tHead').style.display = 'none';
    document.getElementById('pager').style.display = 'none';
    const tb = document.getElementById('tBody');
    if (type === 'init') tb.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="empty-ico">🔍</div><div class="empty-title">Nhập thông tin cầu thủ</div><div class="empty-desc">Nhập tên hoặc SPID để bắt đầu tìm kiếm.</div></div></td></tr>`;
    else tb.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="empty-ico">😕</div><div class="empty-title">Không tìm thấy cầu thủ</div><div class="empty-desc">Vui lòng kiểm tra lại chính tả hoặc thử tên khác.</div></div></td></tr>`;
}

function renderPage() {
    document.getElementById('tHead').style.display = '';
    const s = (currentPage - 1) * PAGE_SIZE, e = Math.min(s + PAGE_SIZE, currentFiltered.length);
    const data = currentFiltered.slice(s, e).map(x => x.ref);
    const nk = searchMode === 'name' ? norm(document.getElementById('inName').value).split(/\s+/) : [];
    
    document.getElementById('tBody').innerHTML = data.map(p => {
        const sid = Math.floor(p.id / 1000000), sn = seasonMap.get(sid), urls = getImgUrls(p.id);
        
        // Highlight Tên
        let dName = esc(p.name);
        if (nk.length) {
            const nn = norm(p.name);
            nk.forEach(t => { 
                if (nn.includes(t)) { 
                    const rg = new RegExp(`(${t})`,'gi'); 
                    dName = dName.replace(rg, '<span class="hl">$1</span>'); 
                }
            });
        }

        return `<tr>
            <td style="text-align:center;"><div class="ovr-badge ${getOvrClass(p.ovr)}">${p.ovr || '-'}</div></td>
            <td><span class="spid-code" onclick="copyToClipboard('${p.id}', 'SPID')" title="Bấm để Copy">${p.id}</span></td>
            <td>
                <div class="player-row">
                    <div class="avatar-wrap"><img src="${urls[0]}" class="avatar-img" data-url-index="0" onerror="handleImgErr(this,${p.id})"></div>
                    <div><div class="player-name">${dName}</div><div class="player-pid">PID: ${getPid(p.id)}</div></div>
                </div>
            </td>
            <td>
                <div class="season-cell">
                    ${sn ? `<img src="${sn.seasonImg}" class="season-img"><span class="season-label">${sn.className}</span>` : `<span style="color:var(--text-4)">Mùa ${sid}</span>`}
                </div>
            </td>
        </tr>`;
    }).join('');
    
    renderPager(currentFiltered.length);
}

function renderPager(total) {
    const tp = Math.ceil(total / PAGE_SIZE), pg = document.getElementById('pager');
    if (tp <= 1) { pg.style.display = 'none'; return; }
    pg.style.display = 'flex';
    let h = `<button class="pg-btn" onclick="currentPage=1; renderPage()" ${currentPage === 1 ? 'disabled' : ''}>«</button>`;
    let s = Math.max(1, currentPage - 2), e = Math.min(tp, currentPage + 2);
    for (let i = s; i <= e; i++) {
        h += `<button class="pg-btn ${i === currentPage ? 'cur' : ''}" onclick="currentPage=${i}; renderPage()">${i}</button>`;
    }
    h += `<button class="pg-btn" onclick="currentPage=${tp}; renderPage()" ${currentPage === tp ? 'disabled' : ''}>»</button>`;
    pg.innerHTML = h;
}

// =====================================================
// KHỞI TẠO (INIT)
// =====================================================
window.onload = async () => {
    buildSeasonList();
    loadVisitorCount();
    try {
        const res = await fetch('./spid_translated.json');
        if(!res.ok) throw new Error("Không tìm thấy file JSON");
        
        playerDB = await res.json();
        playerIndex = playerDB.map(p => {
            const sid = Math.floor(p.id / 1000000), sn = seasonMap.get(sid);
            return { 
                ref: p, 
                nameNorm: norm(p.name), 
                seasonNorm: sn ? sn.className.toLowerCase() : "", 
                spidStr: String(p.id), 
                pidStr: String(getPid(p.id)) 
            };
        });
        
        document.getElementById('sTotalPlayers').textContent = playerDB.length.toLocaleString();
        document.getElementById('sTotalSeasons').textContent = seasons.length;
        showEmpty('init');
    } catch(e) {
        document.getElementById('tBody').innerHTML = `<tr><td colspan="4"><div class="empty">❌ Lỗi tải dữ liệu JSON: ${e.message}</div></td></tr>`;
    }
};
</script>
