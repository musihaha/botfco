<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Online Player Database - Professional Search</title>
    <style>
        :root {
            --primary-color: #00e676;
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #b0b0b0;
            --border: #2d2d2d;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-wrapper {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input {
            background: #252525;
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 230, 118, 0.2);
        }

        #stats {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .search-tips {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #666;
            line-height: 1.6;
        }

        .search-tips kbd {
            background: #333;
            padding: 1px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #aaa;
            border: 1px solid #444;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #252525;
            padding: 16px;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .player-avatar-wrapper {
            width: 55px;
            height: 55px;
            position: relative;
            flex-shrink: 0;
        }

        .player-avatar {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .player-avatar.action-img {
            object-fit: contain;
            object-position: top center;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .player-avatar-fallback {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #444;
        }

        .spid-code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: var(--primary-color);
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .season-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .season-icon {
            width: 32px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .player-name {
            font-weight: 600;
            color: #efefef;
        }

        .highlight {
            color: var(--primary-color);
            background: rgba(0, 230, 118, 0.15);
            padding: 0 2px;
            border-radius: 2px;
        }

        #loading-overlay {
            padding: 40px;
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .search-grid { grid-template-columns: 1fr; }
            .player-avatar-wrapper { width: 45px; height: 45px; }
        }
    </style>
</head>

        {"seasonId": 856, "className": "25UCL", "seasonImg": "https://ssl.nexon.com/s2/game/fc/online/obt/externalAssets/new/season/25ucl.png"}
    ];

    const seasonMap = new Map(seasons.map(s => [s.seasonId, s]));
    let playerDB = [];
    // ===== INDEX ĐÃ CHUẨN HÓA - tính 1 lần khi load =====
    let playerIndex = [];

    // ===== BẢNG CHUYỂN ĐỔI KÝ TỰ ĐẶC BIỆT =====
    // Những ký tự mà NFD KHÔNG phân tách được
    const SPECIAL_CHAR_MAP = {
        'ø': 'o', 'Ø': 'O',
        'đ': 'd', 'Đ': 'D',
        'ð': 'd', 'Ð': 'D',
        'ß': 'ss',
        'æ': 'ae', 'Æ': 'AE',
        'œ': 'oe', 'Œ': 'OE',
        'ł': 'l', 'Ł': 'L',
        'þ': 'th', 'Þ': 'TH',
        'ı': 'i', 'İ': 'I',
        'ş': 's', 'Ş': 'S',
        'ğ': 'g', 'Ğ': 'G',
        'ŧ': 't', 'Ŧ': 'T',
        'ħ': 'h', 'Ħ': 'H',
        'ŋ': 'ng', 'Ŋ': 'NG',
        'ĸ': 'k',
        'ŀ': 'l', 'Ŀ': 'L',
        'ĳ': 'ij', 'Ĳ': 'IJ',
        // Ký tự Cyrillic phổ biến trong tên cầu thủ
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
        'е': 'e', 'ё': 'yo', 'ж': 'zh', 'з': 'z', 'и': 'i',
        'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
        'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
        'у': 'u', 'ф': 'f', 'х': 'kh', 'ц': 'ts', 'ч': 'ch',
        'ш': 'sh', 'щ': 'shch', 'ъ': '', 'ы': 'y', 'ь': '',
        'э': 'e', 'ю': 'yu', 'я': 'ya',
    };

    // ===== HÀM CHUẨN HÓA THÔNG MINH =====
    function smartNormalize(str) {
        if (!str) return "";
        
        let result = str;
        
        // Bước 1: Thay thế các ký tự đặc biệt trước khi NFD
        for (const [char, replacement] of Object.entries(SPECIAL_CHAR_MAP)) {
            result = result.split(char).join(replacement);
        }
        
        // Bước 2: NFD decomposition - tách dấu khỏi ký tự gốc
        // VD: ü → u + ¨  |  é → e + ́  |  ñ → n + ~
        result = result.normalize("NFD");
        
        // Bước 3: Xóa tất cả combining diacritical marks (U+0300 → U+036F)
        result = result.replace(/[\u0300-\u036f]/g, "");
        
        // Bước 4: Xóa mọi ký tự không phải chữ/số/space
        // (dấu chấm, ngoặc, gạch ngang, nháy đơn... đều bị loại)
        result = result.replace(/[^a-zA-Z0-9\s]/g, "");
        
        // Bước 5: Gộp khoảng trắng thừa & lowercase
        result = result.replace(/\s+/g, " ").trim().toLowerCase();
        
        return result;
    }

    // ===== LẤY PID TỪ SPID =====
    function getPidFromSpid(spid) {
        return spid % 1000000;
    }

    function getPlayerImageUrls(spid) {
        const pid = getPidFromSpid(spid);
        return [
            `https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${spid}.png`,
            `https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${pid}.png`,
            `https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/players/p${spid}.png`,
            `https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/players/p${pid}.png`,
            `https://fo4.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${spid}.png`,
            `https://fo4.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${pid}.png`,
            `https://fo4.dn.nexoncdn.co.kr/live/externalAssets/common/players/p${spid}.png`,
            `https://fo4.dn.nexoncdn.co.kr/live/externalAssets/common/players/p${pid}.png`,
        ];
    }

    function handleImageError(img, spid) {
        const urls = getPlayerImageUrls(spid);
        let currentIndex = parseInt(img.dataset.urlIndex || "0");
        currentIndex++;
        
        if (currentIndex < urls.length) {
            img.dataset.urlIndex = currentIndex;
            img.src = urls[currentIndex];
            if (currentIndex === 2 || currentIndex === 3 || currentIndex === 6 || currentIndex === 7) {
                img.classList.remove('action-img');
            }
        } else {
            img.style.display = 'none';
            const wrapper = img.parentElement;
            if (wrapper) {
                wrapper.innerHTML = '<div class="player-avatar-fallback">⚽</div>';
            }
        }
    }

    // ===== DEBOUNCE - tránh gọi filter liên tục khi gõ nhanh =====
    let debounceTimer;
    function debouncedFilter() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(filterData, 150);
    }

    // ===== LOAD DATA + XÂY INDEX =====
    async function loadData() {
        try {
            const response = await fetch('./spid_translated.json');
            if (!response.ok) throw new Error("File spid_translated.json không tồn tại!");
            playerDB = await response.json();

            // Xây index chuẩn hóa 1 lần — search sẽ rất nhanh
            updateStats(`Đang xây dựng chỉ mục tìm kiếm...`);
            
            playerIndex = playerDB.map(p => {
                const pSeasonId = Math.floor(p.id / 1000000);
                const season = seasonMap.get(pSeasonId);
                return {
                    ref: p,
                    nameNorm: smartNormalize(p.name),
                    seasonNorm: season ? season.className.toLowerCase() : "",
                    seasonId: pSeasonId
                };
            });

            // Populate season datalist
            const datalist = document.getElementById('seasonList');
            seasons.forEach(s => {
                const option = document.createElement('option');
                option.value = s.className;
                datalist.appendChild(option);
            });

            document.getElementById('loading-overlay').style.display = 'none';
            updateStats(`✅ Sẵn sàng: ${playerDB.length.toLocaleString()} cầu thủ đã được lập chỉ mục.`);
        } catch (error) {
            document.getElementById('loading-overlay').innerHTML = `❌ Lỗi: ${error.message}`;
            console.error(error);
        }
    }

    // ===== BỘ LỌC THÔNG MINH =====
    function filterData() {
        const nameQueryRaw = document.getElementById('nameInput').value;
        const nameNorm = smartNormalize(nameQueryRaw);
        
        const seasonQueryRaw = document.getElementById('seasonInput').value;
        const seasonQuery = seasonQueryRaw.trim().toLowerCase();

        const tbody = document.getElementById('playerList');
        
        if (nameNorm.length < 2 && seasonQuery === "") {
            tbody.innerHTML = "";
            updateStats("Nhập ít nhất 2 ký tự để tìm kiếm...");
            return;
        }

        // Tách thành nhiều token → TẤT CẢ phải khớp
        // VD: "son heung" → ["son", "heung"] → cả hai phải có trong tên
        const nameTokens = nameNorm.split(/\s+/).filter(t => t.length > 0);

        const filtered = playerIndex.filter(entry => {
            // ===== Kiểm tra tên =====
            let isNameMatch = true;
            if (nameTokens.length > 0) {
                // Mỗi token phải xuất hiện trong tên đã chuẩn hóa
                isNameMatch = nameTokens.every(token => entry.nameNorm.includes(token));
            }

            // ===== Kiểm tra mùa =====
            let isSeasonMatch = true;
            if (seasonQuery !== "") {
                const exactMatch = (entry.seasonNorm === seasonQuery);
                const partialMatch = entry.seasonNorm.includes(seasonQuery) && seasonQuery.length >= 2;
                isSeasonMatch = exactMatch || partialMatch;
            }

            return isNameMatch && isSeasonMatch;
        });

        // Sắp xếp: ưu tiên khớp chính xác hơn lên trước
        const scored = filtered.map(entry => {
            let score = 0;
            
            // Tên bắt đầu bằng token đầu tiên → ưu tiên cao
            if (nameTokens.length > 0 && entry.nameNorm.startsWith(nameTokens[0])) {
                score += 100;
            }
            
            // Có từ nào trong tên bắt đầu bằng token → ưu tiên
            const nameWords = entry.nameNorm.split(" ");
            for (const token of nameTokens) {
                if (nameWords.some(w => w.startsWith(token))) {
                    score += 50;
                }
                // Khớp chính xác một từ
                if (nameWords.some(w => w === token)) {
                    score += 30;
                }
            }
            
            // Tên ngắn hơn (khớp chặt hơn) → ưu tiên
            score -= entry.nameNorm.length;
            
            return { entry, score };
        });

        scored.sort((a, b) => b.score - a.score || b.entry.ref.id - a.entry.ref.id);

        const top200 = scored.slice(0, 200).map(s => s.entry.ref);
        renderResults(top200, nameTokens);
        updateStats(`🔍 Tìm thấy ${filtered.length.toLocaleString()} kết quả${filtered.length > 200 ? " (hiển thị 200 đầu)" : ""}`);
    }

    // ===== HIGHLIGHT KẾT QUẢ =====
    function highlightName(originalName, tokens) {
        if (!tokens || tokens.length === 0) return escapeHtml(originalName);
        
        const nameNorm = smartNormalize(originalName);
        const chars = [...originalName];
        const normChars = [...smartNormalize(originalName)];
        
        // Tạo mapping giữa vị trí ký tự gốc và ký tự đã chuẩn hóa
        // Do smartNormalize có thể thay đổi độ dài (ß→ss), ta dùng cách đơn giản hơn
        let highlighted = escapeHtml(originalName);
        
        for (const token of tokens) {
            // Tìm vị trí token trong chuỗi đã normalize
            const idx = nameNorm.indexOf(token);
            if (idx === -1) continue;
            
            // Dùng regex case-insensitive trên chuỗi gốc
            // Tạo pattern linh hoạt: mỗi ký tự trong token match ký tự gốc + dấu tùy ý
            let pattern = "";
            for (const ch of token) {
                // Mỗi ký tự match: chính nó hoặc phiên bản có dấu
                pattern += ch + "[\\u0300-\\u036f]*[.'\\-]?\\s?";
            }
            
            try {
                const regex = new RegExp(`(${pattern.slice(0, -4)})`, 'gi');
                highlighted = highlighted.replace(regex, '<span class="highlight">$1</span>');
            } catch(e) {
                // Fallback nếu regex lỗi
            }
        }
        
        return highlighted;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function renderResults(data, nameTokens) {
        const tbody = document.getElementById('playerList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 30px; color: #888;">Không tìm thấy kết quả phù hợp</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(p => {
            const pSeasonId = Math.floor(p.id / 1000000);
            const season = seasonMap.get(pSeasonId);
            const imgUrls = getPlayerImageUrls(p.id);
            const displayName = highlightName(p.name, nameTokens);
            
            return `
                <tr>
                    <td><span class="spid-code">${p.id}</span></td>
                    <td>
                        <div class="player-info">
                            <div class="player-avatar-wrapper">
                                <img 
                                    src="${imgUrls[0]}" 
                                    class="player-avatar action-img" 
                                    alt="${escapeHtml(p.name)}"
                                    data-spid="${p.id}"
                                    data-url-index="0"
                                    onerror="handleImageError(this, ${p.id})"
                                    loading="lazy"
                                >
                            </div>
                            <span class="player-name">${displayName}</span>
                        </div>
                    </td>
                    <td>
                        <div class="season-box">
                            ${season 
                                ? `<img src="${season.seasonImg}" class="season-icon" alt="${season.className}" loading="lazy"> <span>${season.className}</span>` 
                                : `<span style="color:#666">Mùa ${pSeasonId}</span>`}
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function updateStats(text) {
        document.getElementById('stats').textContent = text;
    }

    window.onload = loadData;
</script>
